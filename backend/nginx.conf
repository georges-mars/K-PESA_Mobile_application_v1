server {
    listen 80;
    server_name api.k-pesa.tech;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.k-pesa.tech;

    ssl_certificate     /etc/letsencrypt/live/api.k-pesa.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.k-pesa.tech/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Max request body size (for API JSON, 1MB is plenty)
    client_max_body_size 1m;

    location / {
        proxy_pass         http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
